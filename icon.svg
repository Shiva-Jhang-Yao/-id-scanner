<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="120" y1="80" x2="900" y2="920" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5b2f14"/>
      <stop offset="0.5" stop-color="#7a3f1b"/>
      <stop offset="1" stop-color="#8d4a20"/>
    </linearGradient>

    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffb47a"/>
      <stop offset="1" stop-color="#d97757"/>
    </linearGradient>

    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#ffb47a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f4a261"/>
      <stop offset="1" stop-color="#ffb47a" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#f4a261" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="240" fill="url(#bg)"/>

  <!-- Outer scanning frame -->
  <g stroke="url(#warm)" stroke-width="18" stroke-linecap="round" filter="url(#glow)">
    <path d="M240 360V240H360"/>
    <path d="M664 240H784V360"/>
    <path d="M240 664V784H360"/>
    <path d="M664 784H784V664"/>
  </g>

  <!-- Central card -->
  <g filter="url(#softGlow)">
    <rect x="280" y="280" width="464" height="464" rx="40"
          fill="#3a1e0e"
          stroke="url(#warm)"
          stroke-width="10"/>
  </g>

  <!-- Inner image area -->
  <rect x="340" y="340" width="344" height="344" rx="24"
        fill="#4a2b17"
        stroke="#8a5a3a"
        stroke-width="4"/>

  <!-- Sun -->
  <circle cx="590" cy="420" r="34" fill="#ffb47a" opacity="0.9"/>

  <!-- Landscape -->
  <path d="M360 620L455 500L535 580L615 460L664 520V664H360V620Z"
        fill="url(#warm)"
        opacity="0.9"/>

  <!-- Scan line -->
  <rect x="320" y="505" width="384" height="12" rx="6"
        fill="url(#scan)"
        filter="url(#glow)"/>

  <!-- Precision crop icon -->
  <g stroke="#ffd1a8" stroke-width="16" stroke-linecap="round" filter="url(#glow)">
    <path d="M690 470V640"/>
    <path d="M610 550H780"/>
  </g>

  <!-- Corner dots -->
  <circle cx="300" cy="220" r="6" fill="#ffb47a"/>
  <circle cx="740" cy="220" r="6" fill="#f4a261"/>
  <circle cx="220" cy="740" r="6" fill="#ffb47a"/>
  <circle cx="804" cy="740" r="6" fill="#f4a261"/>
</svg>
